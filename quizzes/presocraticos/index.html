const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycby73_7skIE4YhC4wxzt5QZIkY_uxbZNZlRcuSg5kPynvKDzhCZS__bi9O2xs2G3E9Z3/exec';

// Contraseña que el profesor da al alumnado para entrar (no distingue mayúsculas/minúsculas ni tildes)
const EXAM_PASS = 'logos2027';
// Contraseña del panel del profesor (no distingue mayúsculas/minúsculas ni tildes)
const TEACHER_PASS = 'presocráticos2027';
const EXAM_NAME = 'Presocráticos - 2º Bach';
const STORAGE_KEY = 'examen_presocraticos_v1', DONE_KEY = 'examen_presocraticos_hechos_v1';
// Penalización: cada 3 respuestas erróneas restan 1 acierto. Las preguntas en blanco no restan.
const ERRORES_POR_PENALIZACION = 3;

const Q=[{"b": "Introducción", "q": "Según el tema, el problema del conocimiento verdadero radica en la distinción entre…", "o": ["lo útil y lo inútil para la vida", "lo que parece y lo que es", "la ética individual y la política", "el mito religioso y la poesía épica"], "c": 1}, {"b": "Introducción", "q": "¿Qué es el arjé que buscaban los presocráticos?", "o": ["El destino que imponen los dioses olímpicos", "El método de diálogo para definir conceptos", "La ley escrita que rige la polis", "El principio fundamental que subyace a todas las cosas"], "c": 3}, {"b": "Introducción", "q": "¿Qué tomó Platón principalmente de Heráclito?", "o": ["La concepción del alma inmortal", "La idea de la mutabilidad de lo sensible", "La teoría del ser inmutable y de la episteme", "La teoría de los átomos y el vacío"], "c": 1}, {"b": "Introducción", "q": "El conceptualismo socrático se caracteriza por…", "o": ["buscar, mediante la razón y el diálogo, definiciones de conceptos universales como el bien o la justicia", "afirmar que la realidad es un flujo sin medida alguna, por lo que no es posible definir ningún concepto", "reducir el conocimiento verdadero a lo que muestran los sentidos, ya que la razón engaña con sus abstracciones", "explicar toda la realidad a partir de cuatro raíces eternas que se mezclan y se separan por el Amor y la Discordia"], "c": 0}, {"b": "Heráclito", "q": "¿Por qué se llamaba a Heráclito «el Oscuro»?", "o": ["Porque negaba la existencia de la luz y el fuego", "Porque vivía retirado en una cueva", "Por el estilo enigmático de sus enseñanzas", "Porque sostenía que el arjé era la noche"], "c": 2}, {"b": "Heráclito", "q": "Según el tema, la frase «Heráclito no era heracliteano» significa que…", "o": ["que Heráclito, en realidad, negaba el cambio igual que Parménides y consideraba ilusorio el devenir", "las cosas permanecen cambiando y cambian permaneciendo; el flujo no destruye por completo su identidad", "que Heráclito no escribió nada y su doctrina fue inventada después por los heracliteanos de Éfeso", "que todo se disuelve en nada en cada instante, de modo que ninguna cosa conserva identidad alguna"], "c": 1}, {"b": "Heráclito", "q": "En la interpretación del tema, ¿dónde reside la identidad de una cosa (por ejemplo, de un río)?", "o": ["En una organización o medida (logos, métron) que se mantiene a través del cambio de su materia", "En la materia concreta que la forma en cada instante, de modo que si cambia el agua ya es otro río", "En un elemento indivisible que permanece inmóvil bajo el cambio aparente de las aguas", "En el nombre que los hombres le ponen por convención, sin que haya nada real que permanezca"], "c": 0}, {"b": "Heráclito", "q": "¿En qué aspecto el ADN NO sirve como modelo del logos heraclíteo?", "o": ["En que el ADN es un principio inmaterial y separado, mientras que el logos es un elemento físico", "En que el ADN no conserva ningún patrón estable mientras se renuevan sus átomos y moléculas", "En que el ADN muta y evoluciona, mientras que el logos se presenta como siempre verdadero y común", "En que los átomos del ADN no se reemplazan nunca, mientras que en el logos todo fluye sin medida"], "c": 2}, {"b": "Heráclito", "q": "La autopoiesis, concepto de Maturana y Varela (1972), define al ser vivo como…", "o": ["un cristal que crece por simple acumulación de materia del entorno, sin regenerar sus procesos", "una máquina fabricada desde fuera según un plano fijo que un diseñador externo ha establecido", "una red cerrada de procesos que se produce continuamente a sí misma y especifica su propio límite", "un conjunto de átomos estables que no se renuevan y que definen al organismo por su composición química"], "c": 2}, {"b": "Heráclito", "q": "En la teoría de la autopoiesis, ¿qué diferencia hay entre organización y estructura?", "o": ["La organización debe permanecer invariante; la estructura (los componentes materiales concretos) cambia continuamente", "Son sinónimos en la teoría: ambas designan los componentes materiales concretos, que nunca cambian", "La organización es la materia que compone el sistema y la estructura es el alma que lo gobierna", "La estructura debe permanecer invariante, mientras que la organización cambia continuamente con el entorno"], "c": 0}, {"b": "Heráclito", "q": "Según Heráclito, el logos se muestra a la razón de los «hombres despiertos». ¿Qué significa su afirmación «la naturaleza ama ocultarse»?", "o": ["Que solo los iniciados en los misterios órficos pueden ver la naturaleza tal como es", "Que la naturaleza es caótica y carece de cualquier ley o medida que la razón pueda descubrir", "Que los dioses esconden la naturaleza a los hombres como castigo por una culpa anterior", "Que la verdadera estructura de la realidad no es evidente a los sentidos y exige una reflexión filosófica"], "c": 3}, {"b": "Heráclito", "q": "Para Heráclito, el logos que unifica todos los cambios consiste en…", "o": ["el capricho de los dioses, que deciden en cada momento qué nace y qué muere en la naturaleza", "el azar ciego de los choques entre átomos que se mueven sin ningún plan en el vacío infinito", "la fuerza del Amor, que une los elementos, y la del Odio, que los separa en un ciclo cósmico", "la lucha y conciliación de los opuestos: «la guerra (pólemos) es el padre de todas las cosas»"], "c": 3}, {"b": "Heráclito", "q": "¿Por qué eligió Heráclito el fuego como arjé?", "o": ["Porque de él nacieron los primeros seres vivos, envueltos en cortezas espinosas", "Porque el fuego solo existe como proceso continuo y, aunque cambia de forma, sigue siendo uno", "Porque es el elemento más pesado y estable, el que mejor resiste el paso del tiempo", "Porque el alma es aliento y el fuego no es más que aire condensado por el frío"], "c": 1}, {"b": "Heráclito", "q": "¿Quiénes son, para Heráclito, los «hombres despiertos»?", "o": ["Los que han purificado su alma mediante la música", "Los que se fían de la pluralidad que muestran los sentidos", "Los que captan con la razón el logos oculto y viven en armonía con él", "Los iniciados en los misterios órficos"], "c": 2}, {"b": "Heráclito", "q": "Según los fragmentos de Anaximandro recogidos en el tema, el ser humano…", "o": ["se formó por la combinación azarosa de las cuatro raíces, guiada solo por el Amor", "nació en un principio de criaturas de especie distinta, porque necesita una larga crianza", "surgió del aire por condensación, igual que las nubes, el agua y la tierra", "fue creado directamente por los dioses con la forma que tiene hoy, sin necesidad de crianza"], "c": 1}, {"b": "Pitagóricos", "q": "¿Qué contraposición, procedente de Anaximandro, aparece en el pitagorismo primitivo?", "o": ["Entre el Amor que une y la Discordia que separa", "Entre lo lleno (los átomos) y lo vacío", "Entre lo limitado (peras) y lo ilimitado (ápeiron)", "Entre el Noûs y la masa caótica de semillas"], "c": 2}, {"b": "Pitagóricos", "q": "¿Qué diferencia hay entre Anaximandro y los pitagóricos respecto a lo limitado y lo ilimitado?", "o": ["Para Anaximandro el ápeiron es el único principio (monismo); para los pitagóricos límite e ilimitado son co-principios (dualismo)", "Anaximandro es dualista porque defiende dos principios; los pitagóricos son monistas y solo admiten el ápeiron", "Ninguno de los dos habla de lo ilimitado: ambos parten de un elemento concreto, como el agua o el aire", "Los pitagóricos subordinan lo limitado a lo ilimitado, que es su origen; Anaximandro los pone en pie de igualdad"], "c": 0}, {"b": "Pitagóricos", "q": "Según Anaxímenes, ¿qué produce la rarefacción del aire?", "o": ["Las piedras y los minerales", "El agua y la tierra", "El fuego", "Las nubes y el viento"], "c": 2}, {"b": "Pitagóricos", "q": "En la Tetractys pitagórica, ¿qué representan los cuatro primeros números?", "o": ["Los cuatro elementos de Empédocles: fuego, aire, agua y tierra, que suman la totalidad", "Las cuatro estaciones del año, que marcan el ritmo del cosmos y suman doce meses", "Los cuatro intervalos de la escala musical, que suman siete notas en total", "El punto, la recta, la superficie y el volumen, que suman diez, el número perfecto"], "c": 3}, {"b": "Pitagóricos", "q": "¿En qué funda Alcmeón de Crotona la inmortalidad del alma?", "o": ["En su automovimiento perpetuo, por analogía con los astros", "En que el alma es una mezcla equilibrada de humores", "En que el alma está formada por átomos muy sutiles", "En que el alma es la afinación del cuerpo"], "c": 0}, {"b": "Pitagóricos", "q": "Según el orfismo, ¿por qué está el alma encerrada en el cuerpo?", "o": ["Por una culpa anterior, y debe purificarse para escapar del ciclo de reencarnaciones", "Porque el cuerpo es su forma natural y se destruye con él", "Porque los átomos del alma son más pesados que los del cuerpo", "Porque así lo decidió el Noûs al ordenar el cosmos"], "c": 0}, {"b": "Pitagóricos", "q": "¿En qué se diferencia la purificación pitagórica de la órfica?", "o": ["La pitagórica se realiza sobre todo mediante las matemáticas y la contemplación del orden del cosmos; la órfica insiste en el ritual y la iniciación", "La pitagórica consiste en sacrificios a los dioses olímpicos; la órfica, en la lectura de los poemas de Homero", "No hay diferencia: ambas rechazan la metempsicosis y buscan la salud del cuerpo mediante la dieta y la gimnasia", "La pitagórica es solo ritual e iniciática, mientras que la órfica se basa sobre todo en el estudio de las matemáticas"], "c": 0}, {"b": "Pitagóricos", "q": "La anécdota de Pitágoras y el cachorro apaleado («es el alma de un amigo») ilustra…", "o": ["la lucha de contrarios, que Heráclito llamaba padre de todas las cosas", "la teoría de que los números son la esencia y el origen de todas las cosas", "la transmigración de las almas y el parentesco de todos los seres vivos", "la armonía de las esferas, que no oímos por estar acostumbrados a ella"], "c": 2}, {"b": "Pitagóricos", "q": "¿Por qué consideraban los pitagóricos la música una auténtica medicina?", "o": ["Porque el ruido de la música impedía oír la armonía de las esferas, que enfermaba a los hombres", "Porque purifica el alma, que es armonía, y restablece la armonía del cuerpo, cuya pérdida es la enfermedad", "Porque el sonido de la lira expulsa del cuerpo los átomos más pesados y dañinos", "Porque la música apaciguaba a los dioses olímpicos, que eran los causantes de las enfermedades"], "c": 1}, {"b": "Pitagóricos", "q": "Según los pitagóricos, ¿por qué no oímos la música de las esferas?", "o": ["Porque en el espacio no hay aire que transmita el sonido", "Porque los astros están inmóviles", "Porque estamos acostumbrados a ella desde el nacimiento", "Porque solo la oyen los hombres dormidos"], "c": 2}, {"b": "Pitagóricos", "q": "Según Anaxímenes, ¿qué proceso del aire da lugar a las nubes, el agua, la tierra y las piedras?", "o": ["La mezcla y separación causada por el Amor y la Discordia", "La condensación, ligada al frío", "La rarefacción, ligada al calor", "La lucha de contrarios, regida por el logos"], "c": 1}, {"b": "Pitagóricos", "q": "¿Cuál de las siguientes NO es una de las especificidades pitagóricas señaladas en el tema?", "o": ["La purificación mediante la ascesis, la ciencia y la música", "La existencia de átomos indivisibles que se mueven en el vacío", "Los números como esencia y origen de las cosas", "La preexistencia y transmigración de las almas"], "c": 1}, {"b": "Parménides", "q": "¿Qué partes tenía el poema de Parménides Sobre la naturaleza?", "o": ["Una teogonía, una cosmogonía y una ética", "Las Purificaciones y Acerca de la naturaleza", "Un diálogo, una refutación y un mito final", "Un proemio, la vía de la verdad y la vía de la opinión"], "c": 3}, {"b": "Parménides", "q": "En el proemio del poema, ¿quiénes guían el carro del poeta hacia la diosa?", "o": ["Las Musas, hijas de Zeus", "Los Titanes castigados por Zeus", "Las Erinias, guardianas de la Noche", "Las Helíades, las hijas del Sol"], "c": 3}, {"b": "Parménides", "q": "La verdad del camino del ser, «el ser es y el no-ser no es», se corresponde con los principios lógicos de…", "o": ["conservación de la energía e inercia", "identidad y no contradicción", "causalidad y finalidad", "tercero excluido y razón suficiente"], "c": 1}, {"b": "Parménides", "q": "¿En qué consiste el error del camino de la opinión (doxa)?", "o": ["En afirmar que el ser es uno e inmutable, sin dejar lugar al cambio que vemos", "En la mezcla engañosa de ser y no-ser, creyendo que las cosas nacen, perecen y cambian", "En negar la existencia del no-ser, cuando es evidente que el vacío existe", "En fiarse solo de la razón, despreciando lo que los sentidos nos enseñan del mundo"], "c": 1}, {"b": "Parménides", "q": "¿Cuál de estas características NO corresponde al ser de Parménides?", "o": ["Pensable: ser y pensar son lo mismo", "Múltiple y divisible en partes", "Eterno, sin principio ni fin", "Inmutable e inmóvil"], "c": 1}, {"b": "Parménides", "q": "¿Qué consecuencia tiene la crítica de Parménides para la filosofía posterior?", "o": ["Se vuelve al monismo del agua de Tales, porque es el único elemento capaz de transformarse en todos los demás", "Ya no puede sostenerse un único arjé del que todo surja por transformación, y aparecen los pluralistas", "Se acepta que el ser nace del no-ser, con lo que se vuelve a la cosmología de los primeros milesios", "Se abandona por completo el estudio de la naturaleza y la filosofía se dedica solo a la ética y la política"], "c": 1}, {"b": "Parménides", "q": "¿Qué pretendía demostrar Zenón con argumentos como el de Aquiles y la tortuga o el de la flecha?", "o": ["Por reducción al absurdo, que el movimiento no existe", "Que el logos es la lucha de contrarios", "Que el movimiento es eterno y azaroso", "Que los números son la esencia de las cosas"], "c": 0}, {"b": "Parménides", "q": "Según Henri Bergson, lo que realmente demuestran las paradojas de Zenón es que…", "o": ["el movimiento no existe en absoluto, y la experiencia sensible de él es completamente engañosa", "el movimiento solo existe en el vacío, como sostendrían más tarde Leucipo y Demócrito", "el movimiento es una ilusión de los hombres dormidos, que no captan el logos que lo rige", "el movimiento, aunque lo experimentamos, no se puede pensar o demostrar lógicamente"], "c": 3}, {"b": "Parménides", "q": "¿Cómo corrige Platón a Parménides en el Sofista (el llamado «parricidio»)?", "o": ["Distinguiendo el no-ser como nada absoluta del no-ser como alteridad o diferencia", "Aceptando que solo existen los átomos y el vacío infinito en el que se mueven", "Negando que exista un mundo inteligible y reduciendo todo a lo sensible", "Afirmando que el ser nace del no-ser mediante la condensación y la rarefacción"], "c": 0}, {"b": "Parménides", "q": "¿Con qué conceptos ataca Aristóteles el corazón de la argumentación parmenídea?", "o": ["Límite (peras) e ilimitado (ápeiron)", "Homeomerías y Noûs (Inteligencia)", "Amor (philía) y Discordia (neîkos)", "Potencia (dýnamis) y acto (enérgeia)"], "c": 3}, {"b": "Empédocles", "q": "Para Empédocles, ¿qué constituye la realidad?", "o": ["Cuatro raíces (fuego, aire, agua y tierra) unidas y separadas por el Amor y la Discordia", "Átomos indivisibles e invisibles que se mueven por azar en el vacío infinito", "Un único ser eterno, inmóvil y esférico, sin partes ni vacío alguno", "Infinitas semillas de todas las sustancias, mezcladas y ordenadas por una Inteligencia"], "c": 0}, {"b": "Empédocles", "q": "En el ciclo cósmico de Empédocles, ¿qué ocurre cuando domina el Amor?", "o": ["Todo está unido formando una esfera", "Todo se separa en forma de vórtice o remolino", "El aire se rarifica y se convierte en fuego", "Los átomos chocan al azar en el vacío"], "c": 0}, {"b": "Empédocles", "q": "¿Qué es, para Empédocles, lo que los hombres llaman «nacimiento» y «muerte»?", "o": ["Una ilusión de los sentidos, sin ninguna base real, como sostenía Parménides", "La intervención del Noûs, que separa y ordena la masa caótica de semillas", "Solo mezcla e intercambio de lo que está mezclado: nada se destruye completamente", "El paso del no-ser al ser y del ser al no-ser, que ocurre en cada ser vivo"], "c": 2}, {"b": "Empédocles", "q": "La frase de Empédocles «una misma cosa son el pelo, las hojas, los plumajes de las aves y las escamas» expresa…", "o": ["que el alma es inmortal y se mueve a sí misma, como el pelo crece sin ayuda", "que la materia es infinitamente divisible y en cada cosa hay partes de todas", "que todo está hecho de números, pues pelo, hojas y escamas tienen proporciones exactas", "el oculto parentesco entre los distintos reinos y especies de seres vivos"], "c": 3}, {"b": "Anaxágoras", "q": "¿Qué le ocurrió a Anaxágoras, amigo de Pericles, en Atenas?", "o": ["Fundó la escuela eleática junto a Parménides", "Fue discípulo de Sócrates y murió bebiendo cicuta", "Fue elegido arconte y gobernó la ciudad", "Fue acusado de impiedad, huyó y se refugió en Lámpsaco"], "c": 3}, {"b": "Anaxágoras", "q": "¿Qué son las homeomerías de Anaxágoras?", "o": ["Las cuatro raíces (fuego, aire, agua y tierra) de las que se componen todas las cosas", "Átomos indivisibles e inalterables que solo difieren en forma, orden y posición", "Semillas de partes semejantes, infinitamente divisibles, de modo que todo contiene de todo", "Los números pares que, al recibir el límite, dan forma a lo ilimitado"], "c": 2}, {"b": "Anaxágoras", "q": "¿Qué características tiene el Noûs de Anaxágoras?", "o": ["Es un dios creador que hace el mundo de la nada en un momento determinado del tiempo", "Es una masa caótica e inerte en la que están mezcladas todas las semillas desde el principio", "Es un principio activo, infinito, separado de la mezcla e inmaterial, que introduce el movimiento y el orden", "Es el vacío infinito en el que se mueven los átomos, que también es real aunque no sea material"], "c": 2}, {"b": "Anaxágoras", "q": "La pregunta de Anaxágoras «¿cómo podría nacer el pelo de lo que no es pelo y la carne de lo que no es carne?» sirve para defender que…", "o": ["el pelo y la carne son ilusiones de los sentidos, pues solo existe el ser uno", "todo procede del aire por condensación, que primero forma agua y luego carne", "en cada cosa hay ya gérmenes (homeomerías) de todo, y solo varía la proporción", "todo nace del no-ser por la voluntad de los dioses, que dan forma a la materia"], "c": 2}, {"b": "Atomistas", "q": "Para Leucipo y Demócrito, los elementos de la realidad son…", "o": ["lo limitado (peras) y lo ilimitado (ápeiron)", "lo lleno y lo vacío, a los que llamaron ser y no-ser", "el fuego eterno que se enciende y se apaga con medida", "las semillas infinitas y la Inteligencia ordenadora"], "c": 1}, {"b": "Atomistas", "q": "Según Aristóteles, los átomos difieren por «ritmo, contacto y revolución». ¿A qué corresponden?", "o": ["Al peso, el color y el sabor", "Al tamaño, la temperatura y la velocidad", "Al Amor, la Discordia y el azar", "A la forma, el orden y la posición"], "c": 3}, {"b": "Atomistas", "q": "¿En qué se opone Demócrito a Anaxágoras respecto a la divisibilidad de la materia?", "o": ["Para Demócrito la materia no es infinitamente divisible: hay elementos últimos indivisibles, los átomos", "Para Demócrito la materia es infinitamente divisible, como para Anaxágoras", "Demócrito niega que exista la materia", "Demócrito afirma que la materia es un único ser continuo"], "c": 0}, {"b": "Atomistas", "q": "¿Cómo explican los atomistas el orden del mundo, a diferencia de Anaxágoras?", "o": ["Por puro azar y necesidad mecánica, sin una inteligencia ordenadora", "Por la acción del Amor, que une los elementos en una esfera", "Por la armonía numérica que impone el límite sobre lo ilimitado", "Por la intervención del Noûs, una inteligencia separada de la mezcla"], "c": 0}, {"b": "Atomistas", "q": "¿Qué significa que, según Demócrito, lo frío, lo dulce o los colores existen «por convención»?", "o": ["Que son acuerdos de la asamblea, igual que las leyes de la polis, sin base natural", "Que solo una inteligencia separada (el Noûs) puede percibirlas correctamente", "Que son cualidades reales y objetivas que poseen los átomos en sí mismos", "Que en realidad solo hay átomos y vacío, y los sentidos ofrecen un efecto subjetivo"], "c": 3}];

function gR(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]')}catch{return[]}}
function sR(e){try{const r=gR();r.push(e);localStorage.setItem(STORAGE_KEY,JSON.stringify(r))}catch{}}
function gD(){try{return JSON.parse(localStorage.getItem(DONE_KEY)||'[]')}catch{return[]}}
function sD(m){try{const d=gD();d.push(m);localStorage.setItem(DONE_KEY,JSON.stringify(d))}catch{}}
function norm(s){return String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().toLowerCase()}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

function showLogin(m){m=m||'alumno';ct.innerHTML=`<div class="login-screen"><h2>${m==='alumno'?'Identificación del alumno/a':'Acceso del profesor'}</h2><p>${m==='alumno'?'Introduce tus datos y la contraseña del examen.':'Introduce la contraseña.'}</p><div class="login-box"><div class="login-toggle"><button class="toggle-btn ${m==='alumno'?'active':''}" onclick="showLogin('alumno')">Alumno/a</button><button class="toggle-btn ${m==='profesor'?'active':''}" onclick="showLogin('profesor')">Profesor</button></div><div id="lf">${m==='alumno'?sF():tF()}</div></div></div>`;const f=document.querySelector('#lf input');if(f)setTimeout(()=>f.focus(),80)}

function doSL(){const g=id=>document.getElementById(id),n=g('in').value.trim(),e=g('ie').value.trim().toLowerCase(),c=g('ic').value,x=norm(g('ix').value);let v=1;
const chk=(ok,id)=>{g(id).style.display=ok?'none':'block';if(!ok)v=0};

try{await fetch(APPS_SCRIPT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify({fecha:e.date,nombre:e.name,curso:e.curso,correo:e.email,nota:e.nota,aciertos:e.ok,errores:e.ko,blanco:e.bl,netos:e.net,total:e.tp,porcentaje:e.pct,examen:EXAM_NAME,respuestas:e.resp})});return'ok'}catch{return'error'}}

async function finish(){
running=false;const tp=Q.length;let ok=0,ko=0,bl=0;

ct.innerHTML=`<div class="results"><div class="student-tag"><span class="dot"></span>${esc(stu.name)} · ${esc(stu.curso)}</div><h2>Examen terminado</h2><div class="score-circle" style="border-color:${gc}"><span class="big" style="color:${gc}">${nota.toFixed(2).replace('.',',')}</span><span class="label">nota sobre 10</span></div><div id="ss" class="sync-status sync-pending">⏳ Enviando resultados...</div><p style="margin-top:1.2rem;font-size:.85rem;color:var(--text-muted)">Ya puedes cerrar esta ventana.</p></div>`;
const r=await sendGS(entry),ss=document.getElementById('ss');
if(r==='ok'){ss.className='sync-status sync-ok';ss.textContent='✓ Resultados enviados al profesor'}
else if(r==='no-url'){ss.className='sync-status sync-pending';ss.textContent='ℹ Guardado en este dispositivo (Google Sheets no configurado)'}
else{ss.className='sync-status sync-fail';ss.textContent='⚠ Error de envío. Avisa al profesor: queda guardado en este dispositivo.'}}

function showTP(){
const res=gR().sort((a,b)=>b.nota-a.nota||a.name.localeCompare(b.name));
let rows='';res.forEach((r,i)=>{rows+=`<tr><td class="rank-pos">${i+1}</td><td><strong>${esc(r.name)}</strong></td><td>${esc(r.curso)}</td><td>${esc(r.email)}</td><td class="rank-score">${r.nota}</td><td>${r.ok}</td><td>${r.ko}</td><td>${r.bl}</td><td>${r.net}/${r.tp}</td><td>${esc(r.date)}</td></tr>`});
if(!res.length)rows=`<tr><td colspan="10" style="text-align:center;padding:2rem;color:var(--text-muted)">Sin resultados en este dispositivo.<br>Los centralizados están en Google Sheets.</td></tr>`;
const key=Q.map(q=>'ABCD'[q.c]).join(' ');
ct.innerHTML=`<div class="ranking-section"><h3>Panel del profesor</h3><p style="text-align:center;font-size:.85rem;color:var(--text-muted);margin-bottom:1rem">${Q.length} preguntas · cada ${ERRORES_POR_PENALIZACION} errores restan 1 acierto · Nota = aciertos netos / ${Q.length} × 10.<br>Datos de este dispositivo; los centralizados están en tu <strong>Google Sheets</strong>.</p><div class="ranking-table-wrap"><table class="ranking-table"><thead><tr><th>#</th><th>Alumno/a</th><th>Curso</th><th>Correo</th><th>Nota</th><th>Aciertos</th><th>Errores</th><th>Blanco</th><th>Netos</th><th>Fecha</th></tr></thead><tbody>${rows}</tbody></table></div><div style="text-align:center">${res.length?`<button class="excel-btn" onclick="dlXL()">📊 Descargar Excel</button>`:''}<button class="excel-btn" onclick="if(confirm('¿Borrar los resultados y los bloqueos de este dispositivo?')){localStorage.removeItem(STORAGE_KEY);localStorage.removeItem(DONE_KEY);showTP()}" style="border-color:var(--wrong);color:var(--wrong);margin-left:.5rem">Borrar datos locales</button></div><details style="margin-top:1.2rem;font-size:.8rem;color:var(--text-muted)"><summary style="cursor:pointer">Plantilla de respuestas</summary><p style="margin-top:.5rem;word-spacing:.3rem">${key}</p></details><div style="text-align:center;margin-top:1rem"><button class="restart-btn" onclick="showLogin('alumno')">← Volver</button></div></div>`}

function dlXL(){
const res=gR().sort((a,b)=>b.nota-a.nota);
const d=[['Fecha','Nombre','Curso','Correo','Nota','Aciertos','Errores','En blanco','Aciertos netos','Total preguntas','Porcentaje','Examen','Respuestas']];
res.forEach(r=>d.push([r.date,r.name,r.curso,r.email,r.nota,r.ok,r.ko,r.bl,r.net,r.tp,r.pct,EXAM_NAME,r.resp]));
const wb=XLSX.utils.book_new(),ws=XLSX.utils.aoa_to_sheet(d);
ws['!cols']=[{wch:17},{wch:28},{wch:18},{wch:32},{wch:6},{wch:9},{wch:8},{wch:9},{wch:13},{wch:14},{wch:11},{wch:22},{wch:55}];
XLSX.utils.book_append_sheet(wb,ws,'Resultados');XLSX.writeFile(wb,'Resultados_Examen_Presocraticos.xlsx')}

showLogin('alumno');
</script>
</body>
</html>
